{% extends "base.html" %}
{% block title %}Register · StudyVault{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create account</h2>
  <form method="post">
    <label>Name</label><input name="name" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Password (min 6 characters)</label><input name="password" type="password" minlength="6" required>
    <p><button class="btn" type="submit">Register</button></p>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
