<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyVault{% endblock %}</title>
  <style>
    :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
            --accent:#2f5d50; --accent-ink:#fff; --danger:#b3261e; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    a { color:var(--accent); text-decoration:none; }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    .bar { max-width:900px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .brand { font-weight:700; font-size:18px; color:var(--ink); }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
    .narrow { max-width:400px; margin:40px auto; }
    label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
    input, textarea, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    textarea { min-height:220px; resize:vertical; }
    .btn { display:inline-block; padding:9px 16px; border-radius:8px; border:1px solid var(--accent);
           background:var(--accent); color:var(--accent-ink); font:inherit; cursor:pointer; }
    .btn.ghost { background:transparent; color:var(--accent); }
    .btn.danger { background:transparent; border-color:var(--danger); color:var(--danger); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .muted { color:var(--muted); font-size:14px; }
    .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#e6efe9; color:var(--accent); }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; }
    .flash.error { background:#fbe9e7; color:var(--danger); }
    .flash.ok { background:#e6efe9; color:var(--accent); }
    .note-item h3 { margin:0 0 6px; }
    .content { white-space:pre-wrap; line-height:1.55; }
    ul.files { list-style:none; padding:0; margin:0; }
    ul.files li { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
    form.inline { display:inline; }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ url_for('index') }}">StudyVault</a>
    {% if current_user.is_authenticated %}
      <div class="row"><span class="muted">{{ current_user.name }}</span>
        <a class="btn ghost" href="{{ url_for('logout') }}">Log out</a></div>
    {% endif %}
  </div>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
